<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessibility Quiz</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <img id="logo" alt="freeCodeCamp" src="https://cdn.freecodecamp.org/platform/universal/fcc_primary.svg">

        <h1>HTML/CSS Quiz</h1>
   <nav>
    <ul>
        <li><a href="#student-info"></a>INFO</li>
        <li><a href="#html-questions"></a>HTML</li>
        <li><a href="#css-questions"></a>CSS</li>
    </ul>
   </nav>
    </header>
    <main>
        <form method="post" action="https://freecodecamp.org/practice-project/accessibility-quiz">
            <div class="student-info-container">
            <h2 id="student-info">Student Info</h2>
            <hr>
<div class="info">
    <label for="student-name">Name : </label>
<input type="text" name="student-name" id="student-name" />
<label for="student-email">Email : </label>
<input type="email" name="student-email" id="student-email" />
<label for="birth-date">DOB :
<span clas="sr-only">(Date Of Birth)</span>    
</label>
<input type="text" name="birth-date" id="birth-date" />


</div>
        </div>
        
        </form>
    </main>
</body>
</html>
