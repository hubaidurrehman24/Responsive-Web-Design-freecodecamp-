<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Registeration Form</title>
</head>
<body>
    <h1>Registeration Form</h1>
    <p>please fill out this form with the required information</p>
    <form method="post" action="https://register-demo.freecodecamp.org">
        <fieldset>

    <label for="first-name">Enter Your First Name :
        <input id="first-name" name="first-name" type="text" required>
        </label>
        <label for="last-name">Enter Your Last Name :
            <input id="last-name" name="last-name" type="text" required>
    </label>
    <label for="email">Enter Your Email address :
        <input id="email" name="email" type="email" required>
</label>
<label for="new-password">Create a New Password :
    <input id="new-password" name="new-password" type="password" pattern="[a-z0-5]{8,}" required>
</label>

</fieldset>

<fieldset>
    <legend>Account type(required)</legend>
    <label for="personal-account">
        <input type="radio" name="account-type" id="personal-account" class="inline" checked />
    Personal
    </label>
    <label for="bussiness-account">
        <input type="radio" name="account-type" id="bussiness-account" class="inline"  />
    Bussiness
    </label>
</fieldset>

<fieldset>
    <label for="profile-picture">Upload a profile picture : 
<input type="file" name="file" id="profile-picture" >
</label>
<label for="age">Input your age(years) : 
<input type="number" name="age" id="age"
min="15" max=""50>
</label>
<label for="referrer">How did you hear about us?
    <select name="referrer" id="referrer">
        <option value="">(Select One)</option>
    <option value="1">freeCodeCamp News</option>
    <option value="2">freeCodeCamp Youtube Channel</option>
   <option value="3">freeCodeCamp Forum</option>
   <option value="4">Other</option> 
</select>
</label>
<label for="bio">Provie a bio :
    <textarea name="bio" id="bio" rows="3" cols="30" placeholder="I like coding..... ">
 </textarea>
</label>
</fieldset>
<label for="terms-and-conditons">
    <input type="checkbox" name="terms-and-conditons" id="terms-and-conditons" class="inline" required>
I accept the <a href="https://www.freecodecamp.org/news/terms-of-service/">terms and conditions</a>
</label>
<input type="submit" value="Submit" >
</form>
</body>

</html>
