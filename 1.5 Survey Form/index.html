<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1 id="title">freeCodeCamp Survey Form</h1>
    <p id="description">Thank you for taking the time to help us improve the platform</p>

    <form id="survey-form">
        <label id="name-label" for="name">Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>

        <label id="email-label" for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" required>

        <label id="number-label" for="age">Age (optional)</label>
        <input type="number" id="number" name="age" min="1" max="120" placeholder="Age">

        <label for="dropdown">Which option best describes your current role?</label>
        <select id="dropdown" name="role">
            <option value="student">Student</option>
            <option value="job">Full Time Job</option>
            <option value="learner">Full Time Learner</option>
            <option value="preferNo">Prefer not to say</option>
            <option value="other">Other</option>
        </select>

        <p>Would you recommend freeCodeCamp to a friend?</p>
        <label><input type="radio" name="recommend" value="definitely" required> Definitely</label>
        <label><input type="radio" name="recommend" value="maybe"> Maybe</label>
        <label><input type="radio" name="recommend" value="notSure"> Not sure</label>

        <label for="most-like">What is your favorite feature of freeCodeCamp?</label>
        <select id="most-like" name="mostLike">
            <option value="challenges">Challenges</option>
            <option value="projects">Projects</option>
            <option value="community">Community</option>
            <option value="openSource">Open Source</option>
        </select>

        <label>What would you like to see improved? (Check all that apply)</label>
        <label><input type="checkbox" name="improve" value="front-end-projects"> Front-end Projects</label>
        <label><input type="checkbox" name="improve" value="back-end-projects"> Back-end Projects</label>
        <label><input type="checkbox" name="improve" value="data-visualization"> Data Visualization</label>
        <label><input type="checkbox" name="improve" value="challenges"> Challenges</label>
        <label><input type="checkbox" name="improve" value="open-source-community"> Open Source Community</label>
        <label><input type="checkbox" name="improve" value="gitter-help-rooms"> Gitter help rooms</label>
        <label><input type="checkbox" name="improve" value="videos"> Videos</label>
        <label><input type="checkbox" name="improve" value="city-meetups"> City Meetups</label>
        <label><input type="checkbox" name="improve" value="wiki"> Wiki</label>
        <label><input type="checkbox" name="improve" value="forum"> Forum</label>
        <label><input type="checkbox" name="improve" value="additional-courses"> Additional Courses</label>

        <label for="comments">Any comments or suggestions?</label>
        <textarea id="comments" name="comment" placeholder="Enter your comment here..."></textarea>

        <button type="submit" id="submit">Submit</button>
    </form>
</body>
</html>
